services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env (copy .env.example)}
      # Caps SQL Server's memory so a development laptop is not starved (it otherwise takes up to 80% of what Docker has).
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-1536}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # Logins only start working after SQL Server has upgraded its system databases on the very first start of a new
      # volume, which took about 100 seconds on a modest laptop. The generous retry budget (about 5 minutes) covers that.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080;https://+:8081
      # Port clients use for HTTPS (the host port below). HTTP requests are redirected there.
      ASPNETCORE_HTTPS_PORT: "8443"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${HTTPS_CERT_PASSWORD:?Set HTTPS_CERT_PASSWORD in .env}
      ConnectionStrings__DefaultConnection: Server=db,1433;Database=ProductManagement;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Database__MigrateOnStartup: "true"
      AdminSeed__Email: ${ADMIN_EMAIL:-}
      AdminSeed__Password: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
      - "8443:8081"
    volumes:
      - ./certs:/https:ro

volumes:
  sqlserver-data:
